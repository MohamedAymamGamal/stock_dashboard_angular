<div class="min-h-screen bg-gradient-to-br  from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h1>
      <p class="text-gray-600">Join our stock trading platform today</p>
    </div>

    <!-- Form -->
    <form class="space-y-6" [formGroup]="form" (ngSubmit)="onRegister()">
      <!-- Username Field -->
      <div class="space-y-2">
        <label for="username" class="block text-sm font-medium text-gray-700">
          Username
        </label>
        <input
          id="Username"
          pInputText
          type="text"
          formControlName="Username"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
          placeholder="Enter your username"
          required
          [ngClass]="{
          'border-red-500': username?.invalid && (username?.touched || username?.dirty),
          'border-gray-300': username?.valid || !username?.touched}"
        >
        <small *ngIf="username?.invalid && (username?.touched || username?.dirty)" class="text-red-500">
          Username is required.
        </small>
      </div>

      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email Address
        </label>
        <input
          id="email"
          pInputText
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
          placeholder="Enter your email"
          name="email"
          [ngClass]="{
          'border-red-500': email?.invalid && (email?.touched || email?.dirty),
          'border-gray-300': email?.valid || !email?.touched
          }"
          required
        >
        <small *ngIf="email?.invalid && (email?.touched || email?.dirty)" class="text-red-500">
          Email is required.
        </small>
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <input
          id="password"
          pInputText
          formControlName="password"
          type="password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
          placeholder="Create a strong password"
          name="password"
          required
          [ngClass]="{
          'border-red-500': password?.invalid && (password?.touched || password?.dirty),
          'border-gray-300': password?.valid || !password?.touched
          }"
        >
        <small *ngIf="email?.invalid && (email?.touched || email?.dirty)" class="text-red-500">
          Email is required.
        </small>
      </div>

      <!-- Register Button -->
      <button
        type="submit"
        pButton
        [disabled]="form.invalid"
        class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg"
      >
        Create Account
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="text-sm text-gray-600 mb-4">
        Already have an account?
        <a routerLink="/login" class="text-blue-600 hover:text-blue-700 font-medium transition-colors">
          Sign in
        </a>
      </p>

      <div class="pt-4 border-t border-gray-200">
        <p class="text-xs text-gray-500 leading-relaxed">
          📈 Trade stocks with confidence. Buy low, sell high, and build your investment portfolio.
        </p>
      </div>
    </div>
  </div>
</div>
