<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
      <p class="text-gray-600">Sign in to your StockTrader Pro account</p>
    </div>

    <!-- Form -->
    <form class="space-y-5" [formGroup]="form" (ngSubmit)="onLogin()">
      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email Address
        </label>
        <input
          id="Username"
          pInputText
          formControlName="Username"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
          placeholder="Enter your email"
          [ngClass]="{
            'border-red-500': Username?.invalid && (Username?.touched || Username?.dirty),
            'border-gray-300': Username?.valid || !Username?.touched
          }"
          required
        >
        <small *ngIf="Username?.invalid && (Username?.touched || Username?.dirty)" class="text-red-500">
          <span *ngIf="Username?.errors?.['required']">Email is required.</span>
          <span *ngIf="Username?.errors?.['email']">Please enter a valid email.</span>
        </small>
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <input
          id="password"
          pInputText
          formControlName="password"
          type="password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
          placeholder="Enter your password"
          [ngClass]="{
            'border-red-500': password?.invalid && (password?.touched || password?.dirty),
            'border-gray-300': password?.valid || !password?.touched
          }"
          required
        >
        <small *ngIf="password?.invalid && (password?.touched || password?.dirty)" class="text-red-500">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
        </small>
      </div>

      <!-- Remember Me & Forgot Password -->
<!--      <div class="flex items-center justify-between">-->
<!--        <label class="flex items-center">-->
<!--          <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500">-->
<!--          <span class="text-sm text-gray-600">Remember me</span>-->
<!--        </label>-->
<!--        <a href="#" class="text-sm text-blue-600 hover:text-blue-700 font-medium transition-colors">-->
<!--          Forgot password?-->
<!--        </a>-->
<!--      </div>-->

      <!-- Login Button -->
      <button
        type="submit"
        pButton
        [disabled]="form.invalid"
        class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg"
      >
        Sign In
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="text-sm text-gray-600 mb-4">
        Don't have an account?
        <a routerLink="../register" class="text-blue-600 hover:text-blue-700 font-medium transition-colors">
          Create account
        </a>
      </p>

      <div class="pt-4 border-t border-gray-200">
        <p class="text-xs text-gray-500 leading-relaxed">
          🔐 Secure login with encrypted data transmission
        </p>
      </div>
    </div>
  </div>
</div>
