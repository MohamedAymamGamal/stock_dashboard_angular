
<div class="card">
  <div class="flex items-center justify-center gap-2">

    <app-input-label class="" [rows]="3"  #search placeholder="search"  type="text" label="Name" [autoFocus]="true" />
    <app-button label="Search" type = "submit" severity="danger" icon="pi pi-search"></app-button>
  </div>
  <p-table [value]="stocks" [rowTrackBy]="trackByStockId"  [tableStyle]="{ 'min-width': '50rem' }" >
    <ng-template pTemplate="header">
      <tr>
        <th>Symbol</th>
        <th>Company Name</th>
        <th>purchase</th>
        <th>lastDiv</th>
        <th>industry<th>
        <th>marketCap</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-stock>
      <tr>
        <td>{{ stock.symbol }}</td>
        <td>{{ stock.companyName }}</td>
        <td>{{ stock.purchase }}</td>
        <td>{{ stock.lastDiv }}</td>
        <td>{{ stock.indeustry }}</td>
        <td>{{stock.marketCap}}</td>
        <td>
          <button pButton label="Delete" (click)="delete(stock.id)"></button>
          <button pButton label="View" (click)="viewStockDetails(stock.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!--  {{stock.symbol}}-->
<!--</ng-container>-->
<app-pagination
  [PageNumber]="params.pageNumber"
  [PageSize]="params.pageSize"
  [TotalRecords]="params.totalRecords"
  (PageChange)="onPageChange($event)"
  class="fixed bottom-0 w-full"
>
</app-pagination>
