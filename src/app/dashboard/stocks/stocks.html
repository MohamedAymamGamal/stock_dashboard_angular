<!-- stocks.html -->
<ng-container *ngIf="state$ | async as state">

  <div class="card">

    <!-- search bar -->
    <div class="flex items-center gap-2 mb-4">
      <app-input-label
        [(ngModel)]="searchQuery"
        placeholder="Search by name"
        type="text"
        label="Name"
        [autoFocus]="true"
      />
      <app-button
        label="Search"
        severity="danger"
        icon="pi pi-search"
        (onClick)="onSearch(searchQuery)"
        type="submit"
      >
      </app-button>
      <app-button
        type="submit"
        label="Reset"
        severity="secondary"
        (onClick)="onReset()">
      </app-button>
      <app-button
        type="button"
        label="create stock"
        severity="primary"
        (onClick)="createStock()"
      />


    </div>

    <!-- table -->
    <p-table
      [value]="stocks"
      [rowTrackBy]="trackById">
      <ng-template pTemplate="header">
        <tr>
          <th>Symbol</th>
          <th>Company Name</th>
          <th>Purchase</th>
          <th>Last Div</th>
          <th>Industry</th>
          <th>Market Cap</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-stock>
        <tr>
          <td>{{ stock.symbol }}</td>
          <td>{{ stock.companyName }}</td>
          <td>{{ stock.purchase }}</td>
          <td>{{ stock.lastDiv }}</td>
          <td>{{ stock.indeustry }}</td>
          <td>{{ stock.marketCap }}</td>
          <td class="flex gap-2">
            <app-button type="button" label="View"   (onClick)="viewStockDetails(stock.id)" />
            <app-button type="button" label="Delete" severity="danger" (onClick)="delete(stock.id)" />
            <app-button type="button" label="Update" (onClick)="update(stock.id)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <app-pagination
    [PageNumber]="state.pageNumber"
    [PageSize]="state.pageSize"
    [TotalRecords]="total"
    (PageChange)="onPageChange($event)"
    class="fixed bottom-0 w-full">
  </app-pagination>

</ng-container>
