
<p-button
  [label]="label"
  [type]="type"
  [severity]="severity === 'primary' ? undefined : severity"
  [icon] = "icon"
  [loading] = "loading"
  [disabled] = "disabled"
  (click) = "onClick.emit()"

>
</p-button>
<p-toggleswitch
  *ngIf="type === 'toggle'"
  [disabled] = "disabled"
  (click) = "onClick.emit()">
  <ng-template #handle let-checked="checked">
    <i [ngClass]="['!text-xs', 'pi', checked ? 'pi-check' : 'pi-times']"></i>
  </ng-template>
</p-toggleswitch>
